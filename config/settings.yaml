deriv:
  ws_url: wss://ws.derivws.com/websockets/v3
  app_id: 1089

# Synthetic volatility indices (2-second ticks)
# Volatility 10 / 25 / 50 / 75 — constant vol at 10%, 25%, 50%, 75%
vol_pairs:
  - symbol: R_10
    vol_pct: 10
    weight: 1.0
  - symbol: R_25
    vol_pct: 25
    weight: 1.0
  - symbol: R_50
    vol_pct: 50
    weight: 1.0
  - symbol: R_75
    vol_pct: 75
    weight: 1.0

strategy:
  # Compare high-vol vs low-vol normalized momentum spread
  spread_pair_low: R_10
  spread_pair_high: R_75
  kalman:
    process_noise: 1.0e-4
    observation_noise: 1.0e-2
  entry_zscore: 1.8
  exit_zscore: 0.35
  min_confidence: 0.52
  warmup_ticks: 60
  # Contract: rise/fall over N ticks
  contract_duration: 5
  contract_duration_unit: t   # ticks

risk:
  daily_profit_target_usd: 5.0
  max_daily_loss_pct: 0.05      # 5% of balance per day
  max_drawdown_pct: 0.10        # 10% intraday from daily peak
  max_lifetime_drawdown_pct: 0.20  # 20% from all-time peak — halts across days
  max_consecutive_loss_days: 3   # stop after 3 losing days in a row
  max_stake_usd: 2.0            # max loss per contract (= stake)
  min_stake_usd: 0.35
  stake_pct_of_balance: 0.02    # 2% of balance per trade
  max_open_contracts: 1
  currency: USD

bot:
  state_db: data/bot_state.db
  log_level: INFO
  reconcile_interval_sec: 30
