deriv:
  ws_url: wss://ws.derivws.com/websockets/v3
  app_id: 1089

# Synthetic volatility indices (2-second ticks)
# Volatility 10 / 25 / 50 / 75 — constant vol at 10%, 25%, 50%, 75%
vol_pairs:
  - symbol: R_10
    vol_pct: 10
    weight: 1.0
  - symbol: R_25
    vol_pct: 25
    weight: 1.0
  - symbol: R_50
    vol_pct: 50
    weight: 1.0
  - symbol: R_75
    vol_pct: 75
    weight: 1.0

strategy:
  # Primary spread: wide vol gap | Confirm: mid vol gap
  spread_pair_low: R_10
  spread_pair_high: R_75
  spread_pair_mid_low: R_25
  spread_pair_mid_high: R_50
  kalman:
    process_noise: 1.0e-4
    observation_noise: 1.0e-2
  entry_zscore: 2.0
  exit_zscore: 0.35
  min_confidence: 0.58
  min_payout_ratio: 1.85
  warmup_ticks: 80
  contract_duration: 5
  contract_duration_unit: t

risk:
  daily_profit_target_usd: 5.0
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.10
  max_lifetime_drawdown_pct: 0.25
  max_consecutive_loss_days: 4
  cooldown_hours: 8
  max_stake_usd: 2.0
  min_stake_usd: 0.35
  stake_pct_of_balance: 0.025
  max_open_contracts: 1
  currency: USD

bot:
  state_db: data/bot_state.db
  log_level: INFO
  reconcile_interval_sec: 30
  profit_loop:
    enabled: true
    reinvest_profit_pct: 0.5
    min_seconds_between_trades: 4
    compound_wins: true
